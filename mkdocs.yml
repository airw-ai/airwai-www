site_name: Airwai
site_description: Pavement and right-of-way intelligence. In one pass. Audit-ready ASTM, FHWA, AASHTO, and PROWAG deliverables for federal, state, and AEC customers.
site_author: Airwai, Inc.
site_url: https://airwai.com/
copyright: Copyright &copy; 2026 Airwai, Inc.

repo_name: airw-ai/airwai-www
repo_url: https://github.com/airw-ai/airwai-www
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/airwai-wordmark.svg
  favicon: assets/favicon.svg
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - content.action.edit
    - content.action.view
  icon:
    repo: fontawesome/brands/github
    edit: material/pencil
    view: material/eye

extra_css:
  - stylesheets/airwai.css
  - stylesheets/airwai-docs-v3.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/airw-ai
    - icon: fontawesome/solid/envelope
      link: mailto:info@airwai.com

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - Home: index.md
  - LAIRA Platform: laira.md
  - Pricing & Procurement: pricing.md
  - Customers:
      - customers/index.md
      - San Bernardino International Airport: customers/sbd.md
  - Company: company.md
  - Brand Guide: brand-guide.md
  - Legal:
      - Privacy Policy: legal/privacy.md
      - Terms of Service: legal/terms.md
      - Cookie Preferences: legal/cookie-preferences.md
